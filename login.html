<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login | TastyGo</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body class="page-bg"><nav class="navbar bg-white shadow-sm"><div class="container"><a class="navbar-brand brand" href="index.html">🍴 TastyGo</a><a href="signup.html" class="nav-link">Create account</a></div></nav>
<main class="container py-5"><div class="form-card login-card mx-auto"><div class="text-center mb-4"><div class="login-emoji">🍜</div><h1 class="h2">Welcome back!</h1><p class="text-secondary">Login to continue your food adventure.</p></div>
<form id="loginForm" novalidate><div class="mb-3"><label for="loginId" class="form-label">Email ID or Mobile Number *</label><input id="loginId" class="form-control" required autocomplete="username" placeholder="you@example.com or 10-digit mobile"><div class="invalid-feedback">Enter a valid email or 10-digit mobile number.</div></div>
<div class="mb-2"><label for="loginPassword" class="form-label">Password *</label><input id="loginPassword" type="password" class="form-control" required autocomplete="current-password"><div class="invalid-feedback">Enter your password.</div></div>
<div class="text-end mb-3"><a href="#" id="forgotLink">Forgot password?</a></div><div id="loginMessage" role="status" class="mb-3"></div>
<button class="btn btn-tasty w-100" type="submit">Login</button></form><p class="text-center small text-secondary mt-4 mb-0">New to TastyGo? <a href="signup.html">Sign up</a></p></div></main><script src="js/script.js"></script></body></html>
